name: Release

# タグ `v<version>` (例 `v0.1.0`) のpushでリリース: 検証→GitHub Release→npm publish
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test

  release:
    name: Release (GitHub)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Parse tag and verify version
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_NAME" != "@j1nn0/pi-input-lock" ]; then
            echo "::error::unexpected package name '$PKG_NAME'"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::tag version '$VERSION' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Extract changelog
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && $0 ~ "^## \\[" { exit }
            found { print }
          ' CHANGELOG.md || true)
          if [ -z "$BODY" ]; then
            echo "::warning::no changelog section for v$VERSION; falling back to generated notes"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<EOF"
              echo "$BODY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Pack tarball
        run: |
          mkdir -p /tmp/release
          cd .
          pnpm pack --pack-destination /tmp/release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "@j1nn0/pi-input-lock v${{ steps.meta.outputs.version }}"
          body: "${{ steps.changelog.outputs.body }}"
          generate_release_notes: ${{ steps.changelog.outputs.empty == 'true' }}
          files: /tmp/release/*.tgz

  publish:
    name: Publish to npm
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks
